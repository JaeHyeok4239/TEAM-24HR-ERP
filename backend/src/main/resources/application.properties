spring.application.name=backend

# 기본 실행 프로필
# 로컬에서 별도 설정 없이 실행하면 application-local.properties 사용
spring.profiles.default=local

# Jackson 날짜 직렬화 설정 - LocalDate/LocalDateTime을 배열 대신 문자열로 반환
spring.jackson.serialization.write-dates-as-timestamps=false

# Spring Doc
springdoc.packages-to-scan=com.hr24
springdoc.swagger-ui.path=/api.html

# multipart 정보
spring.servlet.multipart.enabled=true
# 추후 배포 시 Linux 경로
# file.upload-path=/var/www/hr24/uploads