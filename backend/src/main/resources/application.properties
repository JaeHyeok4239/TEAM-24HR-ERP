spring.application.name=backend

# Oracle DB 연결 정보
spring.datasource.url=jdbc:oracle:thin:@192.168.0.237:1522/XEPDB1
spring.datasource.username=hr24
spring.datasource.password=hr24

# redis 연결 정보
spring.data.redis.host=192.168.0.237
spring.data.redis.port=6379

# 구글 SMTP 메일 설정
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# 메일 발송 기능 사용 여부
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_USERNAME:no-reply@24hr.local}

# JWT 설정
jwt.secret=hr24-jwt-secret-key-hr24-jwt-secret-key-hr24
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

# 암호화 개발용키 설정 / 운영 배포 시에는 환경변수로 분리해야 합니다.
hr24.crypto.secret-key=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

# Jackson 날짜 직렬화 설정 - LocalDate/LocalDateTime을 배열 대신 문자열로 반환
spring.jackson.serialization.write-dates-as-timestamps=false

# JPA 설정
# none   : 테이블 자동 생성/수정 안함
# create : 실행 시 테이블 새로 생성
# update : Entity 기준으로 테이블 자동 수정
# Hibernate가 테이블을 자동 생성/수정하지 않음 (DDL 직접 관리)
spring.jpa.hibernate.ddl-auto=none
# 실행되는 SQL을 콘솔에 출력
spring.jpa.show-sql=true
# 출력되는 SQL을 보기 좋게 정렬
spring.jpa.properties.hibernate.format_sql=true
# Oracle DB에 맞는 SQL 문법 사용
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect

# Spring Doc
springdoc.api-docs.enabled=true
springdoc.packages-to-scan=com.hr24
springdoc.swagger-ui.path=/api.html

# File Upload(dev)
file.upload-path=C:/hr24/uploads

# multipart 정보
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=500MB

# 추후 배포 시 Linux 경로
# file.upload-path=/var/www/hr24/uploads

