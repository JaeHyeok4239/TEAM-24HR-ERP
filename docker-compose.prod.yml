services:
  oracle:
    image: gvenzl/oracle-xe:21-slim
    container_name: hr24-oracle
    ports:
      - "${ORACLE_HOST_PORT}:1521"
    environment:
      ORACLE_PASSWORD: "${ORACLE_PASSWORD}"
      APP_USER: "${DB_USERNAME}"
      APP_USER_PASSWORD: "${DB_PASSWORD}"
    volumes:
      - oracle-data:/opt/oracle/oradata
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: hr24-redis
    ports:
      - "${REDIS_HOST_PORT}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: hr24-backend:prod
    container_name: hr24-backend
    ports:
      - "${BACKEND_HOST_PORT}:8080"
    depends_on:
      - oracle
      - redis
    environment:
      SPRING_PROFILES_ACTIVE: prod

      DB_URL: "jdbc:oracle:thin:@oracle:1521/XEPDB1"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"

      REDIS_HOST: redis
      REDIS_PORT: 6379

      MAIL_ENABLED: "${MAIL_ENABLED}"
      MAIL_USERNAME: "${MAIL_USERNAME}"
      MAIL_PASSWORD: "${MAIL_PASSWORD}"

      JWT_SECRET: "${JWT_SECRET}"
      HR24_CRYPTO_SECRET_KEY: "${HR24_CRYPTO_SECRET_KEY}"
      HOLIDAY_API_KEY: "${HOLIDAY_API_KEY}"

      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS}"
      COOKIE_SECURE: "${COOKIE_SECURE}"
      COOKIE_SAME_SITE: "${COOKIE_SAME_SITE}"

      FILE_UPLOAD_PATH: /app/uploads
      SPRINGDOC_ENABLED: "${SPRINGDOC_ENABLED}"
    volumes:
      - ${UPLOAD_HOST_PATH}:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_ORIGIN: "${NEXT_PUBLIC_API_ORIGIN}"
    image: hr24-frontend:prod
    container_name: hr24-frontend
    ports:
      - "${FRONTEND_HOST_PORT}:3000"
    depends_on:
      - backend
    restart: unless-stopped

  apache:
    image: httpd:2.4
    container_name: hr24-apache
    ports:
      - "80:80"
    volumes:
      - ./infra/apache/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  oracle-data:
  redis-data:
