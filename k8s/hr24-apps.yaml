apiVersion: apps/v1
kind: Deployment
metadata:
  name: hr24-backend
  namespace: hr24
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hr24-backend
  template:
    metadata:
      labels:
        app: hr24-backend
    spec:
      containers:
        - name: backend
          image: hr24-backend:prod
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: hr24-config
            - secretRef:
                name: hr24-secret
          env:
            - name: LOGGING_FILE_NAME
              value: /logs/backend.log
            - name: LOGGING_LOGBACK_ROLLINGPOLICY_FILE_NAME_PATTERN
              value: /logs/backend.%d{yyyy-MM-dd}.%i.log
            - name: LOGGING_LOGBACK_ROLLINGPOLICY_MAX_FILE_SIZE
              value: 10MB
            - name: LOGGING_LOGBACK_ROLLINGPOLICY_MAX_HISTORY
              value: "14"
            - name: LOGGING_LOGBACK_ROLLINGPOLICY_TOTAL_SIZE_CAP
              value: 200MB
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
            - name: backend-logs
              mountPath: /logs
      volumes:
        - name: uploads
          hostPath:
            path: /home/sykim/apps/TEAM-24HR-ERP/uploads
            type: DirectoryOrCreate
        - name: backend-logs
          hostPath:
            path: /home/sykim/logs/hr24/backend
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: hr24-backend
  namespace: hr24
spec:
  type: NodePort
  selector:
    app: hr24-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hr24-frontend
  namespace: hr24
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hr24-frontend
  template:
    metadata:
      labels:
        app: hr24-frontend
    spec:
      containers:
        - name: frontend
          image: hr24-frontend:prod
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: hr24-frontend
  namespace: hr24
spec:
  type: NodePort
  selector:
    app: hr24-frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30081
