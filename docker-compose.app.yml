services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: hr24-backend:local
    container_name: hr24-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod

      DB_URL: jdbc:oracle:thin:@192.168.0.237:1522/XEPDB1
      DB_USERNAME: hr24
      DB_PASSWORD: hr24

      REDIS_HOST: 192.168.0.237
      REDIS_PORT: 6379

      MAIL_ENABLED: false
      MAIL_USERNAME: dummy
      MAIL_PASSWORD: dummy

      JWT_SECRET: hr24-jwt-secret-key-hr24-jwt-secret-key-hr24
      HR24_CRYPTO_SECRET_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

      CORS_ALLOWED_ORIGINS: http://localhost:3000
      COOKIE_SECURE: false
      COOKIE_SAME_SITE: Lax

      FILE_UPLOAD_PATH: /app/uploads
      SPRINGDOC_ENABLED: true
    volumes:
      - backend-uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_ORIGIN: http://localhost:8080
    image: hr24-frontend:local
    container_name: hr24-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  backend-uploads: