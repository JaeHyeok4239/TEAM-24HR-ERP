services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: hr24-backend:local
    container_name: hr24-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE}"

      DB_URL: "${DB_URL}"
      DB_USERNAME: "${DB_USERNAME}"
      DB_PASSWORD: "${DB_PASSWORD}"

      REDIS_HOST: "${REDIS_HOST}"
      REDIS_PORT: "${REDIS_PORT}"

      MAIL_ENABLED: "${MAIL_ENABLED}"
      MAIL_USERNAME: "${MAIL_USERNAME}"
      MAIL_PASSWORD: "${MAIL_PASSWORD}"

      JWT_SECRET: "${JWT_SECRET}"
      HR24_CRYPTO_SECRET_KEY: "${HR24_CRYPTO_SECRET_KEY}"
      HOLIDAY_API_KEY: "${HOLIDAY_API_KEY}"

      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS}"
      COOKIE_SECURE: "${COOKIE_SECURE}"
      COOKIE_SAME_SITE: "${COOKIE_SAME_SITE}"

      FILE_UPLOAD_PATH: "${FILE_UPLOAD_PATH}"
      SPRINGDOC_ENABLED: "${SPRINGDOC_ENABLED}"
    volumes:
      - backend-uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_ORIGIN: "${NEXT_PUBLIC_API_ORIGIN}"
    image: hr24-frontend:local
    container_name: hr24-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  backend-uploads: